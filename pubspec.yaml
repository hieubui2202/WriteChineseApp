name: hanzi_trainer
description: "Duolingo-style Hanzi writing trainer built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.5
  google_sign_in: ^6.2.1
  get: ^4.6.6
  shared_preferences: ^2.3.2
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  just_audio: ^0.9.40
  google_fonts: ^6.2.1
  characters: ^1.3.0
  provider: ^6.1.2
  firebase_analytics: ^11.3.0
  firebase_app_check: ^0.2.1+15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/data/sample_characters.json
