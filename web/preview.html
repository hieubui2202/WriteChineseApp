<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanzi Writing Trainer Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: 'Noto Sans', sans-serif;
        background: radial-gradient(circle at top, #1d2330, #0b0d11 70%);
        color: #fff;
      }
      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }
      .glow-button {
        padding: 12px 24px;
        border-radius: 24px;
        border: 1px solid rgba(0, 207, 255, 0.6);
        background: rgba(0, 207, 255, 0.15);
        color: #00cfff;
        font-weight: 600;
        box-shadow: 0 0 24px rgba(0, 207, 255, 0.25);
        text-decoration: none;
      }
      .unit-grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      .unit-card {
        background: linear-gradient(145deg, rgba(18, 20, 24, 0.95), rgba(9, 11, 14, 0.95));
        border-radius: 24px;
        border: 1px solid rgba(0, 207, 255, 0.35);
        padding: 24px;
        backdrop-filter: blur(12px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 18px 35px rgba(0, 0, 0, 0.35);
      }
      .unit-card h3 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .chip {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 14px;
        background: rgba(0, 207, 255, 0.12);
        color: #00d7ff;
      }
      .progress {
        margin-top: 16px;
        height: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #00cfff, #61efff);
        width: 60%;
      }
      footer {
        margin-top: 64px;
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1 style="margin: 0; font-size: 32px">Hanzi Writing Trainer</h1>
          <p style="margin: 8px 0 0; color: rgba(255, 255, 255, 0.75)">
            Duolingo-style flow: nghe, chọn nghĩa, luyện nét, hoàn thành chữ.
          </p>
        </div>
        <a class="glow-button" href="#">Practice</a>
      </header>
      <section class="unit-grid">
        <article class="unit-card">
          <h3>Food & Drinks</h3>
          <p>Tea, water, rice, soup</p>
          <div class="progress"><span></span></div>
          <div class="chip-row">
            <span class="chip">茶</span>
            <span class="chip" style="background: rgba(255, 209, 102, 0.12); color: #ffd166">水</span>
            <span class="chip">饭</span>
            <span class="chip">汤</span>
          </div>
        </article>
        <article class="unit-card" style="border-color: rgba(255, 209, 102, 0.35)">
          <h3>Greetings</h3>
          <p>Hello, thank you, how are you?</p>
          <div class="progress"><span style="width: 30%; background: #ffd166"></span></div>
          <div class="chip-row">
            <span class="chip" style="background: rgba(255, 209, 102, 0.12); color: #ffd166">你</span>
            <span class="chip" style="background: rgba(255, 209, 102, 0.12); color: #ffd166">好</span>
            <span class="chip">谢</span>
            <span class="chip">吗</span>
          </div>
        </article>
      </section>
      <footer>
        Stroke animations, XP, streak, and offline sync powered by Flutter + Firebase.
      </footer>
    </div>
  </body>
</html>
